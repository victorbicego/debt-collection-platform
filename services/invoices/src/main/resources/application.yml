spring:
  application:
    name: invoices
  datasource:
    url: jdbc:postgresql://localhost:5432/collections
    username: collections
    password: collections
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, see docs/adr/0003
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
