name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  invoices:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/invoices
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers uses the Docker engine that comes with the GitHub runner
      - name: Build and test
        run: ./mvnw -B verify
      - name: Build Docker image
        run: docker build -t invoices:${{ github.sha }} .
